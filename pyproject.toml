[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tkdn-finder"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104",
    "uvicorn[standard]>=0.24",
    "beautifulsoup4>=4.12",
    "httpx>=0.25",
    "apscheduler>=3.10",
    "rapidfuzz>=3.5",
    "pydantic-settings>=2.0",
    "jinja2>=3.1",
    "python-multipart>=0.0.6",
    "openpyxl>=3.1",
    "python-dateutil>=2.8",
    "lxml>=4.9",
    "aiosqlite>=0.19",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "respx>=0.20",
    "ruff>=0.1",
    "black>=23",
    "mypy>=1.7",
    "pyinstaller>=6.0",
    "httpx>=0.25",
]

[project.scripts]
tkdn-finder = "tkdn_finder.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tkdn_finder = ["templates/**/*", "static/**/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
