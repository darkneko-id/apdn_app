<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TKDN Finder{% endblock %}</title>
    <!-- Apply dark class synchronously to prevent flash on reload -->
    <script>if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
                }
            }
        }
    </script>
    <!-- Register Alpine store before Alpine initializes -->
    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.store('ui', {
                dark: localStorage.getItem('theme') === 'dark',
                toggleDark() {
                    this.dark = !this.dark;
                    localStorage.setItem('theme', this.dark ? 'dark' : 'light');
                    document.documentElement.classList.toggle('dark', this.dark);
                }
            });
        });
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; }
        [x-cloak] { display: none !important; }
        .htmx-indicator { display: none; }
        .htmx-request .htmx-indicator { display: inline-flex; }
        .htmx-request.htmx-indicator { display: inline-flex; }
    </style>
    {% block head %}{% endblock %}
</head>
<body x-data class="bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100 min-h-screen flex flex-col text-sm transition-colors duration-150">

    <nav class="bg-blue-800 dark:bg-gray-900 border-b border-blue-900 dark:border-gray-800 shadow-sm">
        <div class="max-w-screen-2xl mx-auto px-4 sm:px-6">
            <div class="flex items-center justify-between h-14">
                <div class="flex items-center gap-3">
                    <a href="/" class="text-base font-semibold tracking-tight text-white hover:text-blue-200 dark:hover:text-gray-300 transition-colors">
                        TKDN Finder
                    </a>
                    <span class="text-blue-400 dark:text-gray-600 text-xs hidden sm:block">Sertifikat TKDN Indonesia</span>
                </div>
                <div class="flex items-center gap-1">
                    <!-- Dark mode toggle -->
                    <button
                        @click="$store.ui.toggleDark()"
                        class="p-2 rounded-md text-blue-200 dark:text-gray-400 hover:text-white dark:hover:text-gray-200 hover:bg-blue-700 dark:hover:bg-gray-800 transition-colors"
                        :title="$store.ui.dark ? 'Mode Terang' : 'Mode Gelap'"
                    >
                        <!-- Sun icon (shown in dark mode) -->
                        <svg x-show="$store.ui.dark" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <circle cx="12" cy="12" r="5"/>
                            <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
                            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                            <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
                            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                        </svg>
                        <!-- Moon icon (shown in light mode) -->
                        <svg x-show="!$store.ui.dark" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                        </svg>
                    </button>
                    <div class="w-px h-4 bg-blue-600 dark:bg-gray-700 mx-1"></div>
                    <a href="/" class="px-3 py-1.5 text-xs font-medium text-blue-100 dark:text-gray-400 hover:text-white dark:hover:text-gray-200 hover:bg-blue-700 dark:hover:bg-gray-800 rounded-md transition-colors">Pencarian</a>
                    <a href="/admin" class="px-3 py-1.5 text-xs font-medium text-blue-100 dark:text-gray-400 hover:text-white dark:hover:text-gray-200 hover:bg-blue-700 dark:hover:bg-gray-800 rounded-md transition-colors">Admin</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-1 max-w-screen-2xl mx-auto w-full px-4 sm:px-6 py-6">
        {% block content %}{% endblock %}
    </main>

    <footer class="border-t border-gray-200 dark:border-gray-800 mt-auto">
        <div class="max-w-screen-2xl mx-auto px-4 py-3 text-center text-xs text-gray-400 dark:text-gray-600">
            TKDN Finder v1.0.0 &mdash; Data: Kemenperin P3DN &mdash; Irsan H. Fadjri (darkneko-id)
        </div>
    </footer>
</body>
</html>
