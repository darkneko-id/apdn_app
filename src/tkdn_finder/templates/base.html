<!DOCTYPE html>
<html lang="id" x-data>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TKDN Finder{% endblock %}</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js CDN -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- HTMX CDN -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
        [x-cloak] { display: none !important; }
        .htmx-indicator { display: none; }
        .htmx-request .htmx-indicator { display: inline; }
        .htmx-request.htmx-indicator { display: inline; }
    </style>
    {% block head %}{% endblock %}
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
    <!-- Navigation -->
    <nav class="bg-blue-800 text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center space-x-4">
                    <a href="/" class="text-xl font-bold tracking-tight hover:text-blue-200 transition-colors">
                        TKDN Finder
                    </a>
                    <span class="text-blue-300 text-sm hidden sm:block">Cari Sertifikat TKDN Indonesia</span>
                </div>
                <div class="flex items-center space-x-6">
                    <a href="/" class="text-blue-100 hover:text-white text-sm font-medium transition-colors">
                        Pencarian
                    </a>
                    <a href="/admin" class="text-blue-100 hover:text-white text-sm font-medium transition-colors">
                        Admin
                    </a>
                    <a href="/health" class="text-blue-100 hover:text-white text-sm font-medium transition-colors">
                        Status
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main content -->
    <main class="flex-1 max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-6">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-200 mt-auto">
        <div class="max-w-7xl mx-auto px-4 py-4 text-center text-sm text-gray-500">
            TKDN Finder v0.1.0 &mdash; Data: Kemenperin P3DN &mdash;
            Untuk keperluan pengadaan PT Pertamina Hulu Rokan
        </div>
    </footer>
</body>
</html>
