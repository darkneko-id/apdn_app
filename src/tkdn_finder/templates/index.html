{% extends "base.html" %}
{% block title %}TKDN Finder — Pencarian Sertifikat TKDN{% endblock %}

{% block content %}
<div class="space-y-6">
    <!-- Page header -->
    <div>
        <h1 class="text-2xl font-bold text-gray-900">Pencarian Sertifikat TKDN</h1>
        <p class="mt-1 text-sm text-gray-500">
            Cari produk berdasarkan nama, spesifikasi, merek, atau KBLI. Mendukung koreksi typo otomatis.
        </p>
    </div>

    <!-- Search form -->
    <form id="search-form" class="space-y-4">
        <!-- Main search input -->
        <div class="flex gap-3">
            <div class="flex-1">
                <label for="q" class="sr-only">Kata kunci pencarian</label>
                <input
                    type="text"
                    id="q"
                    name="q"
                    placeholder="Cari nama produk, spesifikasi, merek, atau perusahaan..."
                    class="w-full px-4 py-3 text-base border border-gray-300 rounded-lg shadow-sm
                           focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                    hx-get="/search"
                    hx-trigger="keyup changed delay:{{ debounce_ms }}ms, search"
                    hx-target="#results"
                    hx-include="#search-form"
                    hx-indicator="#spinner"
                    autocomplete="off"
                    autofocus
                />
            </div>
            <button
                type="submit"
                class="px-6 py-3 bg-blue-700 text-white font-medium rounded-lg hover:bg-blue-800
                       focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors"
                hx-get="/search"
                hx-target="#results"
                hx-include="#search-form"
                hx-indicator="#spinner"
            >
                Cari
            </button>
        </div>

        <!-- Filters row -->
        <div class="flex flex-wrap gap-4 items-end">
            <!-- TKDN minimum -->
            <div class="flex flex-col gap-1 min-w-[140px]">
                <label for="tkdn_min" class="text-xs font-medium text-gray-600">TKDN minimum (%)</label>
                <input
                    type="number"
                    id="tkdn_min"
                    name="tkdn_min"
                    value="0"
                    min="0"
                    max="100"
                    step="1"
                    class="px-3 py-2 text-sm border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-blue-500"
                    hx-get="/search"
                    hx-trigger="change"
                    hx-target="#results"
                    hx-include="#search-form"
                    hx-indicator="#spinner"
                />
            </div>

            <!-- KBLI filter -->
            <div class="flex flex-col gap-1 min-w-[180px]">
                <label for="kbli" class="text-xs font-medium text-gray-600">KBLI</label>
                <select
                    id="kbli"
                    name="kbli"
                    class="px-3 py-2 text-sm border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-blue-500"
                    hx-get="/search"
                    hx-trigger="change"
                    hx-target="#results"
                    hx-include="#search-form"
                    hx-indicator="#spinner"
                >
                    <option value="">Semua KBLI</option>
                    {% for k in kbli_list %}
                    <option value="{{ k }}">{{ k }}</option>
                    {% endfor %}
                </select>
            </div>

            <!-- Year filter -->
            <div class="flex flex-col gap-1 min-w-[140px]">
                <label for="year" class="text-xs font-medium text-gray-600">Tahun</label>
                <select
                    id="year"
                    name="year"
                    class="px-3 py-2 text-sm border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-blue-500"
                    hx-get="/search"
                    hx-trigger="change"
                    hx-target="#results"
                    hx-include="#search-form"
                    hx-indicator="#spinner"
                >
                    <option value="">Semua Tahun</option>
                    {% for y in year_list %}
                    <option value="{{ y }}">{{ y }}</option>
                    {% endfor %}
                </select>
            </div>

            <!-- Validity only checkbox -->
            <div class="flex items-center gap-2 pb-2">
                <input
                    type="checkbox"
                    id="validity_only"
                    name="validity_only"
                    value="true"
                    class="h-4 w-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500"
                    hx-get="/search"
                    hx-trigger="change"
                    hx-target="#results"
                    hx-include="#search-form"
                    hx-indicator="#spinner"
                />
                <label for="validity_only" class="text-sm text-gray-700">Hanya berlaku</label>
            </div>

            <!-- Spinner -->
            <div id="spinner" class="htmx-indicator flex items-center pb-2">
                <svg class="animate-spin h-5 w-5 text-blue-600" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
                    <path class="opacity-75" fill="currentColor"
                        d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
                </svg>
            </div>
        </div>
    </form>

    <!-- Results area (populated by HTMX) -->
    <div id="results">
        <p class="text-sm text-gray-400 italic">Ketik kata kunci untuk mulai mencari...</p>
    </div>
</div>
{% endblock %}
