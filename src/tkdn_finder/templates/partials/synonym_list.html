<div id="synonym-list" class="divide-y divide-gray-100 dark:divide-gray-800 max-h-96 overflow-y-auto">
    {% for syn in synonyms %}
    <div class="flex items-center gap-2 px-4 py-1.5 hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors group">
        <span class="font-mono text-xs font-semibold text-gray-800 dark:text-gray-200 w-36 shrink-0 truncate" title="{{ syn.canonical }}">{{ syn.canonical }}</span>
        <span class="flex-1 text-xs text-gray-500 dark:text-gray-400 truncate" title="{{ syn.variants }}">{{ syn.variants }}</span>
        <span class="shrink-0 w-1.5 h-1.5 rounded-full {% if syn.enabled %}bg-green-500{% else %}bg-gray-300 dark:bg-gray-600{% endif %}" title="{% if syn.enabled %}Aktif{% else %}Nonaktif{% endif %}"></span>
        <button
            hx-post="/admin/synonym/delete/{{ syn.id }}"
            hx-target="#synonym-list"
            hx-swap="outerHTML"
            hx-confirm="Hapus '{{ syn.canonical }}'?"
            class="shrink-0 inline-flex items-center gap-1 px-2 py-0.5 text-xs font-medium rounded
                   bg-red-50 dark:bg-red-900/30 text-red-600 dark:text-red-400
                   hover:bg-red-100 dark:hover:bg-red-900/60 transition-colors"
        >✕ Hapus</button>
    </div>
    {% else %}
    <p class="px-4 py-8 text-center text-sm text-gray-400 dark:text-gray-600 italic">Belum ada sinonim.</p>
    {% endfor %}
</div>
