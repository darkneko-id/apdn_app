<div id="synonym-list">
    <table class="min-w-full divide-y divide-gray-100 text-sm">
        <thead class="bg-gray-50">
            <tr>
                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Kanonik</th>
                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Varian</th>
                <th class="px-4 py-3 text-center text-xs font-medium text-gray-500 uppercase">Aktif</th>
            </tr>
        </thead>
        <tbody class="divide-y divide-gray-50">
            {% for syn in synonyms %}
            <tr class="hover:bg-gray-50">
                <td class="px-4 py-3 font-mono font-medium text-gray-800">{{ syn.canonical }}</td>
                <td class="px-4 py-3 text-gray-600">{{ syn.variants }}</td>
                <td class="px-4 py-3 text-center">
                    {% if syn.enabled %}
                    <span class="inline-block w-2 h-2 rounded-full bg-green-500" title="Aktif"></span>
                    {% else %}
                    <span class="inline-block w-2 h-2 rounded-full bg-gray-300" title="Nonaktif"></span>
                    {% endif %}
                </td>
            </tr>
            {% else %}
            <tr>
                <td colspan="3" class="px-4 py-8 text-center text-sm text-gray-400 italic">
                    Belum ada sinonim.
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
